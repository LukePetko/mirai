stages:
  - build
  - deploy

variables:
  IMAGE_NAME: mirai-ts
  CONTAINER_NAME: mirai-ts

build:
  stage: build
  tags:
    - unraid
  script:
    - docker build -t $IMAGE_NAME .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "typescript"'

deploy:
  stage: deploy
  tags:
    - shell
  script:
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - docker run -d
      --name $CONTAINER_NAME
      --restart unless-stopped
      --init
      --network host
      -e HA_HOST=http://$HA_HOST:$HA_PORT
      -e HA_TOKEN=$HA_TOKEN
      -v /mnt/user/appdata/mirai-automations-ts/automations:/automations:ro
      -v mirai_ts_data:/data
      $IMAGE_NAME
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "typescript"'
